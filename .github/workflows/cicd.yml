name: CI/CD Pipeline for Go App

on:
  push:
    branches:
      - main

permissions:
  contents: read 
  packages: write 

env:
  REGISTRY: ghcr.io 
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------
  # JOB 1: CI
  # ---------------------------------------------------
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5

        with:
          go-version: "1.23"
          cache: true


      - name: Run tests
        run: |
          go test -race ./...


      - name: Build
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
          go build -o myapp .

  # ==================================================
  # DOCKER BUILD
  # ==================================================

  docker:

    name: Build & Push Docker Image

    needs:
      - ci

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Login to GHCR
        uses: docker/login-action@v3

        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5

        with:
          images: ${{ env.REGISTRY }}/${{ format('{0}', env.IMAGE_NAME)}}

          tags: |
            type=raw,value=latest
            type=sha


      - name: Build and push image
        uses: docker/build-push-action@v6

        with:
          context: .
          push: true

          tags: |
            ${{ steps.meta.outputs.tags }}

          labels: |
            ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------
  # JOB 2: CD
  # ---------------------------------------------------
  cd:
    name: Deploy to EC2
    
    needs: 
      - docker 
    
    runs-on: ubuntu-latest
    
    environment:
      name: production

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.EC2_HOST }}

          username: ${{ secrets.EC2_USER }}

          key: ${{ secrets.EC2_KEY }}

          script: |

            set -e

            echo "=================================="
            echo "Starting deployment"
            echo "=================================="

            cd /home/${{ secrets.EC2_USER }}/myapp


            echo "Pulling latest image..."

            docker pull ghcr.io/${{ format( '{0}', github.repository)}}:latest


            echo "Starting application..."

            docker compose \
              -f docker-compose.prod.yml \
              up -d \
              --remove-orphans


            echo "Waiting for application..."

            sleep 10


            echo "Container status..."

            docker compose \
              -f docker-compose.prod.yml \
              ps


            echo "Application logs..."

            docker compose \
              -f docker-compose.prod.yml \
              logs \
              --tail=50 \
              myapp


            echo "Cleaning unused Docker images..."

            docker image prune -f


            echo "=================================="
            echo "Deployment completed"
            echo "=================================="
