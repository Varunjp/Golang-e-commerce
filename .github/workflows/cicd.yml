name: CI/CD Pipeline for Go App

on:
  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------
  # JOB 1: CI
  # ---------------------------------------------------
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug — Show CI repo structure
        run: |
          echo "---- CI REPO TREE ----"
          ls -R .

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      # - name: Run Tests
      #   run: go test ./...

      - name: Build Go Binary
        run: |
          GOOS=linux GOARCH=amd64 go build -o myapp .

      # Upload binary
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-binary
          path: myapp

      # Upload templates folder
      - name: Upload Templates Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-templates
          path: templates/

      # Upload static folder
      - name: Upload Static Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-static
          path: static/

  # ---------------------------------------------------
  # JOB 2: CD
  # ---------------------------------------------------
  cd:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Download Binary
        uses: actions/download-artifact@v4
        with:
          name: myapp-binary

      - name: Download Templates
        uses: actions/download-artifact@v4
        with:
          name: app-templates

      - name: Download Static
        uses: actions/download-artifact@v4
        with:
          name: app-static

      - name: Debug — Show CD workspace
        run: |
          echo "---- CD WORKSPACE STRUCTURE ----"
          ls -R .

      # Upload application binary
      - name: Upload Binary to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "myapp"
          target: "/home/${{ secrets.EC2_USER }}/myapp/"

      # Upload templates folder
      - name: Upload Template Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: |
            admin/*
            users/*
          target: "/home/${{ secrets.EC2_USER }}/myapp/templates/"

      # Upload static folder
      - name: Upload Static Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: |
            icons/*
            images/*
            *.css
            *.js
          target: "/home/${{ secrets.EC2_USER }}/myapp/static/"

      # Restart service
      - name: Restart service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo chmod +x /home/${{ secrets.EC2_USER }}/myapp/myapp
            sudo systemctl daemon-reload
            sudo systemctl restart myapp
            sudo systemctl status myapp --no-pager
