services:

  # ==================================================
  # GO APPLICATION
  # ==================================================

  myapp:
    image: ghcr.io/varunjp/golang-e-commerce:latest

    container_name: myapp

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - uploads_data:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - app_network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/"
        ]

      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    stop_grace_period: 20s


  # ==================================================
  # POSTGRESQL
  # ==================================================

  postgres:
    image: postgres:16-alpine

    container_name: myapp-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app_network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # IMPORTANT:
    # PostgreSQL is NOT exposed to the internet.
    # Do not add ports here.



# ====================================================
# VOLUMES
# ====================================================

volumes:

  postgres_data:
    name: myapp_postgres_data
  
  uploads_data:
    name: myapp_uploads_data


# ====================================================
# NETWORK
# ====================================================

networks:

  app_network:
    name: myapp_network
    driver: bridge