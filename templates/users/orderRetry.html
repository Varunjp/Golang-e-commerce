<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Retry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      border-radius: 15px;
    }
    .btn-dark {
      background-color: #000;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow">
        <h3 class="mb-4 text-center">Order retry</h3>
        {{if .error}}
        <div class="alert alert-danger">{{.error}}</div>
        {{end}}
        <form method="POST" id="retry-form" action="/order/retry">
            <h2>{{.OrderId}}</h2>
          <div class="mb-3">
            <input type="hidden" class="form-control" name="orderId" id="orderId" value="{{.OrderId}}" required />
          </div>
          <button type="submit" class="btn btn-dark w-100" id="retry-btn">Retry</button>
        </form>

      </div>
    </div>
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  
document.addEventListener("DOMContentLoaded", function () {
  const retryForm = document.getElementById("retry-form");

  retryForm.addEventListener("submit", function (e) {
    e.preventDefault(); // prevent normal form submission

    const orderId = document.getElementById("orderId").value;

    if (!orderId) {
      alert("Order ID missing!");
      return;
    }

    fetch("/create-razorpay-retryorder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        order_id: orderId // sending original order id for retry
      })
    })
    .then(res => res.json())
    .then(data => {
      if (!data.success) {
        alert("Failed to initiate payment. Redirecting to cart.");
        window.location.href = "/user/cart";
        return;
      } else if (data.success && data.redirect) {
        window.location.href = data.redirect;
        return;
      }

      const options = {
        key: data.key,
        amount: data.amount,
        currency: data.currency,
        name: "Fashion Art",
        description: "Retry Order Payment",
        order_id: data.order_id,
        handler: function (response) {
          fetch("/payment/retry-success", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_signature: response.razorpay_signature,
              order_id: orderId // pass original order ID for backend update
            })
          })
          .then(res => res.json())
          .then(resData => {
            if (resData.success && resData.redirect) {
              window.location.href = resData.redirect;
            } else {
              alert("Payment verification failed.");
            }
          });
        },
        modal: {
          ondismiss: function () {
            fetch("/order/retry-failed", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                order_id: orderId
              })
            })
            .then(res => res.json())
            .then(resData => {
              if (resData.success && resData.redirect) {
                window.location.href = resData.redirect;
              } else {
                alert("Could not redirect after failure.");
              }
            });
          }
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    });
  });
});

</script>

</body>
</html>
