<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    body {
      font-family: 'Arial', sans-serif;
    }
    .hero {
      background-color: #f9f9f9;
      padding: 60px 30px;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
    }
    .brand-logos img {
      max-height: 40px;
      margin: 0 20px;
    }
    .product-card {
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      padding: 15px;
      text-align: center;
    }
    .product-card img {
      max-width: 100%;
      height: 200px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .product-name {
      font-weight: 600;
    }
    .price del {
      color: #888;
      margin-right: 6px;
    }
    .badge-discount {
      background-color: #ff6f61;
      color: white;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-4">
  <a class="navbar-brand fw-bold" href="/">SHOP.CO</a>
  
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarContent">
    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
      <li class="nav-item"><a class="nav-link" href="/user/shop">Shop</a></li>
      <!-- <li class="nav-item"><a class="nav-link" href="#">On Sale</a></li>
      <li class="nav-item"><a class="nav-link" href="#">New Arrivals</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Brands</a></li> -->
    </ul>
    <form action="/user/shop" method="GET" class="d-flex">
      <input type="text" name="search" class="form-control" placeholder="Search for products..." />
      <button type="submit" class="btn btn-dark ms-2">Search</button>
    </form>
    {{if .user}}
    <a href="/user/wishlist" class="btn btn-outline-success ms-2"><i class="bi bi-heart"></i></a>
    {{end}}
    <a href="/user/cart" class="btn btn-outline-secondary ms-2"><i class="bi bi-cart"></i>
    {{ if .user}}
    <a href="/user/profile" class="btn btn-outline-primary ms-2"><i class="bi bi-person"></i>
    </a>
    <a href="/user/logout" class="btn btn-outline-danger ms-3">Logout</a>

    {{ else }}
    <a href="/user/login" class="btn btn-outline-dark ms-3">Login</a>
    {{ end }}    
    
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow">
        <h3 class="mb-4 text-center">Order Retry Payment</h3>
        {{if .error}}
        <div class="alert alert-danger">{{.error}}</div>
        {{end}}
        <form method="POST" id="retry-form" action="/order/retry">
            <h2>Order ID : {{.OrderId}}</h2>
          <div class="mb-3">
            <input type="hidden" class="form-control" name="orderId" id="orderId" value="{{.OrderId}}" required />
          </div>
          <button type="submit" class="btn btn-dark w-100" id="retry-btn">Retry</button>
        </form>

      </div>
    </div>
  </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
  
document.addEventListener("DOMContentLoaded", function () {
  const retryForm = document.getElementById("retry-form");

  retryForm.addEventListener("submit", function (e) {
    e.preventDefault(); // prevent normal form submission

    const orderId = document.getElementById("orderId").value;

    if (!orderId) {
      alert("Order ID missing!");
      return;
    }

    fetch("/create-razorpay-retryorder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        order_id: orderId // sending original order id for retry
      })
    })
    .then(res => res.json())
    .then(data => {
      if (!data.success) {
        alert("Failed to initiate payment. Redirecting to cart.");
        window.location.href = "/user/cart";
        return;
      } else if (data.success && data.redirect) {
        window.location.href = data.redirect;
        return;
      }

      const options = {
        key: data.key,
        amount: data.amount,
        currency: data.currency,
        name: "Fashion Art",
        description: "Retry Order Payment",
        order_id: data.order_id,
        handler: function (response) {
          fetch("/payment/retry-success", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_signature: response.razorpay_signature,
              order_id: orderId // pass original order ID for backend update
            })
          })
          .then(res => res.json())
          .then(resData => {
            if (resData.success && resData.redirect) {
              window.location.href = resData.redirect;
            } else {
              alert("Payment verification failed.");
            }
          });
        },
        modal: {
          ondismiss: function () {
            fetch("/order/retry-failed", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                order_id: orderId
              })
            })
            .then(res => res.json())
            .then(resData => {
              if (resData.success && resData.redirect) {
                window.location.href = resData.redirect;
              } else {
                alert("Could not redirect after failure.");
              }
            });
          }
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    });
  });
});

</script>

</body>
</html>
