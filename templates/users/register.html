<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Shop.co</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      border-radius: 15px;
    }
    .btn-dark {
      background-color: #000;
    }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4 shadow">
        <h3 class="mb-4 text-center">Create Account</h3>
        {{if .error}}
        <div class="alert alert-danger">{{.error}}</div>
        {{end}}
        <form method="POST" id="registerForm" action="/user/register">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" name="username" id="username" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" name="email" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" id="phone" class="form-control" name="phone" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required />
          </div>
          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirm_password" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Referral</label>
            <input type="text" name="referral_code" class="form-control" placeholder="Referral Code (optional)" value="{{.ReferralCode}}">
          </div>
          <button type="submit" class="btn btn-dark w-100">Register</button>
        </form>

        <div class="text-center mt-4">
          <p>OR</p>
          <a href="/auth/google/login" class="btn btn-outline-dark w-100 mb-2">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" style="width: 20px; margin-right: 10px;">
            Sign up with Google
          </a>
        </div>

        <div class="text-center mt-3">
          <p>Already have an account? <a href="/user/login">Login</a></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  
  document.addEventListener('DOMContentLoaded',() =>{
    const form = document.getElementById('registerForm')

    if (!form){
      console.error('Form not found!');
      return;
    }

    form.addEventListener('submit',function(e){
      e.preventDefault();

      // clear previous errors
      document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
      document.querySelectorAll('.invalid-feedback').forEach(el => el.remove());

      const formData = new FormData(form)

      fetch(form.action,{
        method: form.method,
        body: formData,
        headers:  {'X-Requested-With': 'XMLHttpRequest'}
      })
      .then(async response =>{
        const res = await response.json();

        if(response.ok){
          if (res.redirect && res.email){
            const url = new URL(res.redirect, window.location.origin);
            url.searchParams.set('email', res.email);
            window.location.href = url.toString();
          }else{
            location.reload();
          }
        }else if (response.status === 400){
          if (res.errors){
            Object.keys(res.errors).forEach(field => {
              const input = form.querySelector(`[name="${field}"]`);
              if (input) {
                input.classList.add('is-invalid');
                const feedback = document.createElement('div');
                feedback.className = 'invalid-feedback';
                feedback.innerText = res.errors[field];
                input.insertAdjacentElement('afterend', feedback);
              }
            });
          }
        }else{
          alert('Something went wrong. Please try again.');
        }

      })
      .catch(() =>{
        alert('Network error. Please try again.');
      });

    });

  });


</script>

</body>
</html>
