<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Subcategory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow rounded-4 p-4">
      <h3 class="mb-4">Edit Subcategory</h3>

      <form action="/admin/subcategories/update/{{.Subcategory.SubCategoryID}}" id="formsubcat" method="POST">
        <div class="mb-3">
          <label for="name" class="form-label">Subcategory Name</label>
          <input type="text" class="form-control" id="name" name="name" value="{{.Subcategory.SubCategoryName}}" required>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/admin/categories/edit/{{ .Subcategory.CategoryID}}" class="btn btn-secondary ms-2">Back</a>
      </form>
    </div>
  </div>

  <script>
  
  document.addEventListener('DOMContentLoaded',() =>{
    const form = document.getElementById('formsubcat')

    if (!form){
      console.error('Form not found!');
      return;
    }

    form.addEventListener('submit',function(e){
      e.preventDefault();

      // clear previous errors
      document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
      document.querySelectorAll('.invalid-feedback').forEach(el => el.remove());

      const formData = new FormData(form)

      fetch(form.action,{
        method: form.method,
        body: formData,
        headers:  {'X-Requested-With': 'XMLHttpRequest'}
      })
      .then(async response =>{
        const res = await response.json();

        if(response.ok){
          if (res.redirect){
            window.location.href = res.redirect;
          }else{
            location.reload();
          }
        }else if (response.status === 400){
          if (res.errors){
            Object.keys(res.errors).forEach(field => {
              const input = form.querySelector(`[name="${field}"]`);
              if (input) {
                input.classList.add('is-invalid');
                const feedback = document.createElement('div');
                feedback.className = 'invalid-feedback';
                feedback.innerText = res.errors[field];
                input.insertAdjacentElement('afterend', feedback);
              }
            });
          }
        }else{
          alert('Something went wrong. Please try again.');
        }

      })
      .catch(() =>{
        alert('Network error. Please try again.');
      });

    });

  });


</script>

</body>
</html>
