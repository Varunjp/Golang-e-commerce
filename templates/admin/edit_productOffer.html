<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product offer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #111;
      color: #fff;
    }
    .sidebar {
      background-color: #1e1e1e;
      min-height: 100vh;
      padding: 1rem;
    }
    .sidebar .nav-link {
      color: #ccc;
    }
    .sidebar .nav-link.active {
      background-color: #333;
      border-radius: 8px;
      color: #fff;
    }
    .form-label {
      color: #ccc;
    }
    .card-dark {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
    }
    input, select, textarea {
      background-color: #222 !important;
      border: 1px solid #444 !important;
      color: #fff !important;
    }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-2 sidebar">
      <h4 class="text-white">Fashion Art</h4>
      <nav class="nav flex-column">
        <a class="nav-link" href="/admin">Dashboard</a>
        <a class="nav-link" href="/admin/users-list">Customers</a>
        <a class="nav-link" href="/admin/products">Products</a>
        <a class="nav-link" href="/admin/categories">Categories</a>
        <a class="nav-link" href="/admin/reports">Sales Report</a>
        <a class="nav-link" href="/admin/orders">Orders</a>
        <a class="nav-link" href="/admin/banners">Banners</a>
        <a class="nav-link" href="/admin/coupons">Coupons</a>
        <a class="nav-link active" href="/admin/offers">Offers</a>
        <a class="nav-link" href="/admin/wallet-transactions">Wallet</a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="col-md-10 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>Add Product Offer</h4>
        <a href="/admin/offers" class="btn btn-outline-light">Back to Offers</a>
      </div>

      <form action="/admin/offer/product-edit/{{.offer.ID}}" id="offerform" method="POST">
        <div class="card card-dark p-4 mb-4">
          <h5>Product Details</h5>
          <div class="row">
            {{if .error}}
                <div class="alert alert-danger">{{.error}}</div>
              {{end}}
            <div class="col-md-6 mb-3">
                <label class="form-label">Select Product</label>
                <select name="product_id" id="productSelect" class="form-select" required>
                    <option value="">-- Select Product --</option>
                    {{range .Products}}
                        <option value="{{.ProductID}}" {{if eq $.offer.ProductID .ProductID}}selected{{end}}>
                            {{.ProductName}}
                        </option>
                    {{end}}
                </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Offer Name</label>
              <input type="text" name="offer_name" value="{{ .offer.OfferName }}" class="form-control" required>
            </div>

            <div class="col-md-4 mb-3">
              <label class="form-label">Discount Percentage</label>
              <input type="number" name="discount" value="{{ .offer.DiscountPercentage}}" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Offer Start Date</label>
            <input type="date" name="start_date" class="form-control" id="startDate" required value="{{ .offer.CreatedAt.Format "2006-01-02" }}">
            </div>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const today = new Date().toISOString().split('T')[0];
                    const startDateInput = document.getElementById('startDate');
                    startDateInput.setAttribute('min', today);
                });
            </script>
            <div class="col-md-4 mb-3">
                <label class="form-label">Offer End Date</label>
                <input type="date" name="end_date" class="form-control" value="{{ .offer.EndAt.Format "2006-01-02" }}" id="endDate" required>
            </div>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const today = new Date().toISOString().split('T')[0];
                    document.getElementById('endDate').setAttribute('min', today);
                });
            </script>
          </div>
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-success">Save Offer</button>
        </div>
      </form>

    </div>
  </div>
</div>

<script>

  document.addEventListener('DOMContentLoaded',() =>{
    // Handle form submission
    const form = document.getElementById('offerform')

    if (!form){
      console.error('Form not found!');
      return;
    }

    form.addEventListener('submit',function(e){
      e.preventDefault();

      // clear previous errors
      document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
      document.querySelectorAll('.invalid-feedback').forEach(el => el.remove());

      const formData = new FormData(form)

      fetch(form.action,{
        method: form.method,
        body: formData,
        headers:  {'X-Requested-With': 'XMLHttpRequest'}
      })
      .then(async response =>{
        const res = await response.json();

        if(response.ok){
          if (res.redirect){
            window.location.href = res.redirect;
          }else{
            location.reload();
          }
        }else if (response.status === 400){
          if (res.errors){
            Object.keys(res.errors).forEach(field => {
              const input = form.querySelector(`[name="${field}"]`);
              if (input) {
                input.classList.add('is-invalid');
                const feedback = document.createElement('div');
                feedback.className = 'invalid-feedback';
                feedback.innerText = res.errors[field];
                input.insertAdjacentElement('afterend', feedback);
              }
            });
          }
        }else{
          alert('Something went wrong. Please try again.');
        }

      })
      .catch(() =>{
        alert('Network error. Please try again.');
      });

    });

  });
</script>

</body>
</html>
